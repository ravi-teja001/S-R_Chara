# Deploy backend to Railway on push to main.
# One-time setup:
# 1. Create project + Postgres + API service in Railway dashboard (see HOW_TO_RAILWAY.md).
# 2. Add RAILWAY_TOKEN to this repo: Settings → Secrets and variables → Actions.
#    Get token: Railway project → Settings → Public API → Project token.
name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach
